# Gang Chat web client at https://ky-z.com/gang-chat/app/
#
# Paste these blocks into the existing `server { ... }` for ky-z.com, the one
# that already proxies /gang-chat/api/. The `^~` prefix wins over regex
# locations (for example a site-wide static-file cache rule), so place them
# anywhere in that server block.
#
# tool/deploy_web.sh uploads each build to
# /var/www/gang-chat-app/releases/<timestamp>/ and points
# /var/www/gang-chat-app/current at it, so a deploy never serves a mix of old
# and new files. Change the paths in `alias` if you deploy elsewhere.
#
# The web client is a Vite build (apps/web): index.html, the files copied
# from apps/web/public (icons, manifest.json), and assets/ whose file names
# carry a content hash. The configuration written for the earlier Flutter web
# build keeps working with it; this version adds the long cache for assets/.
#
# Note: an `add_header` inside a location replaces every `add_header` it would
# otherwise inherit from the server block. If the server block sets headers
# such as Strict-Transport-Security, repeat them below.

location = /gang-chat/app {
    return 301 /gang-chat/app/;
}

# Hashed bundles, styles and fonts never change under the same name.
location ^~ /gang-chat/app/assets/ {
    alias /var/www/gang-chat-app/current/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        text/javascript
        text/css
        font/ttf
        font/otf
        image/svg+xml;
}

location ^~ /gang-chat/app/ {
    alias /var/www/gang-chat-app/current/;
    index index.html;

    # index.html (which names the current hashed bundle), manifest.json and
    # the icons keep their names across releases, so browsers revalidate them
    # every time; unchanged files come back as a cheap 304 via ETag.
    add_header Cache-Control "no-cache" always;
    etag on;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        text/javascript
        application/json
        application/manifest+json
        image/svg+xml
        text/css;

    # Single-page app: unknown paths load the app shell.
    try_files $uri $uri/ /gang-chat/app/index.html;
}
