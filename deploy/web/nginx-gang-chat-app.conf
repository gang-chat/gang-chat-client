# Gang Chat web client at https://ky-z.com/gang-chat/app/
#
# Paste these blocks into the existing `server { ... }` for ky-z.com, the one
# that already proxies /gang-chat/api/. The `^~` prefix wins over regex
# locations (for example a site-wide static-file cache rule), so place it
# anywhere in that server block.
#
# tool/deploy_web.sh uploads each build to
# /var/www/gang-chat-app/releases/<timestamp>/ and points
# /var/www/gang-chat-app/current at it, so a deploy never serves a mix of old
# and new files. Change the path in `alias` if you deploy elsewhere.
#
# Check once that nginx knows the wasm MIME type, or CanvasKit loads slowly:
#   grep wasm /etc/nginx/mime.types
# If nothing prints, add `application/wasm wasm;` to that file.
#
# Note: an `add_header` inside a location replaces every `add_header` it would
# otherwise inherit from the server block. If the server block sets headers
# such as Strict-Transport-Security, repeat them below.

location = /gang-chat/app {
    return 301 /gang-chat/app/;
}

location ^~ /gang-chat/app/ {
    alias /var/www/gang-chat-app/current/;
    index index.html;

    # Flutter reuses the same file names in every release (main.dart.js,
    # flutter_bootstrap.js, canvaskit/*), so browsers must revalidate each
    # time. Unchanged files still come back as a cheap 304 via ETag.
    add_header Cache-Control "no-cache" always;
    etag on;

    # main.dart.js and canvaskit.wasm are ~10 MB raw and ~3-4 MB gzipped.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        text/javascript
        application/json
        application/wasm
        application/octet-stream
        font/ttf
        font/otf
        image/svg+xml
        text/css;

    # Single-page app: unknown paths load the app shell.
    try_files $uri $uri/ /gang-chat/app/index.html;
}
