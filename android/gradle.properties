org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# Compile Kotlin inside the Gradle daemon instead of a separate Kotlin daemon,
# which keeps memory predictable when several builds run side by side.
kotlin.compiler.execution.strategy=in-process
org.gradle.daemon.idletimeout=900000
