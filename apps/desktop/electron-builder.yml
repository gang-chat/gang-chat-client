# Packaging for the Electron desktop client. Artifact names match the Flutter
# release so the homepage, the release bucket and the in-app updater keep
# working unchanged:
#   GangChat_v<version>.exe, GangChat-<version>-windows.zip, GangChat_v<version>.dmg
appId: com.gangchat.client
productName: Gang Chat
executableName: GangChat
copyright: Copyright © 2026 com.gangchat. All rights reserved.
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: ../../assets/config/app_config.json
    to: app_config.json
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon_256.png
    to: icon.png
asar: true
# Ad-hoc signs macOS builds so Sparkle accepts them (see the script).
afterPack: scripts/after_pack.cjs
# electron-updater feed (Windows): the server's release sync puts latest.yml and
# the blockmap next to the installer in releases/. The app sets
# the same URL at runtime from app_config.json. macOS updates through Sparkle
# from releases/appcast.xml instead, like the Flutter macOS app.
publish:
  provider: generic
  url: https://ky-z.com/gang-chat/assets/releases
electronLanguages:
  - zh-CN
  - zh-TW
  - en-US

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  # Signing is configured in CI through CSC_LINK / CSC_KEY_PASSWORD (the same
  # PFX the Flutter release used); unsigned builds are allowed.
  signAndEditExecutable: true
  # The portable zip; the installer overrides this in `nsis.artifactName`.
  artifactName: GangChat-${version}-windows.${ext}

nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Gang Chat
  uninstallDisplayName: Gang Chat
  installerLanguages: [zh_CN, zh_TW, en_US]
  language: '2052'
  include: build/installer.nsh
  artifactName: GangChat_v${version}.${ext}

mac:
  icon: build/icon.png
  category: public.app-category.social-networking
  minimumSystemVersion: '12.0'
  # Sparkle installs updates from the DMG, so it is the only macOS target.
  # CFBundleVersion (`buildVersion`) is set by scripts/package.mjs.
  target:
    - target: dmg
      arch: [universal]
  # Sparkle (scripts/prepare_sparkle.mjs): the framework next to Electron's,
  # and the Node-API module the main process loads (src/main/sparkle.ts).
  extraFiles:
    - from: build/sparkle/Sparkle.framework
      to: Frameworks/Sparkle.framework
  extraResources:
    - from: build/sparkle/sparkle.node
      to: sparkle/sparkle.node
  # Both are universal already and identical in the x64 and arm64 halves, which
  # @electron/universal only accepts for files listed here.
  x64ArchFiles: '{Contents/Frameworks/Sparkle.framework/**,Contents/Resources/sparkle/sparkle.node}'
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Gang Chat uses your microphone in live rooms.
    NSCameraUsageDescription: Gang Chat uses your camera in live rooms.
    NSCameraUseContinuityCameraDeviceType: true
    NSAudioCaptureUsageDescription: Gang Chat shares system audio with your screen share in live rooms.
    # Sparkle, as in macos/Runner/Info.plist: the same appcast and signing key,
    # so Flutter and Electron installs update from one feed. The app moves the
    # feed to its configured release bucket at runtime.
    SUFeedURL: https://ky-z.com/gang-chat/assets/releases/appcast.xml
    SUPublicEDKey: qt5Xe3gI5E44p2fg3P+2o4VoK5wck2oy+WxpPFu/g3A=
    SUEnableAutomaticChecks: false
    SUShowReleaseNotes: false

dmg:
  artifactName: GangChat_v${version}.${ext}
  writeUpdateInfo: false

linux:
  target: [dir]
  category: Network
