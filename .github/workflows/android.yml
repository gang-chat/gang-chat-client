name: android

# Checks and builds the native Android client (android/): unit, Robolectric and
# Compose UI tests plus a debug APK uploaded as a workflow artifact.
# release.yml builds the signed release APK.

on:
  push:
    paths:
      - 'android/**'
      - 'assets/**'
      - 'tool/check_utf8.py'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'assets/**'
      - 'tool/check_utf8.py'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: UTF-8 encoding check
        working-directory: .
        run: python3 tool/check_utf8.py

      - name: Unit tests
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/core/build/reports/tests/
            android/app/build/reports/tests/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
