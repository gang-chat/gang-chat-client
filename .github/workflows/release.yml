name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix, for example 1.2.0'
        required: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      android_version_code: ${{ steps.version.outputs.android_version_code }}
      tag: ${{ steps.version.outputs.tag }}
      released_at: ${{ steps.version.outputs.released_at }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="$DISPATCH_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION" ]; then echo "version is empty"; exit 1; fi
          if ! printf '%s' "$VERSION" | grep -Eq \
            '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "version must be major.minor.patch: $VERSION"
            exit 1
          fi
          IFS='.' read -r VERSION_MAJOR VERSION_MINOR VERSION_PATCH <<< "$VERSION"
          if [ "${#VERSION_MAJOR}" -gt 4 ] || \
             [ "${#VERSION_MINOR}" -gt 3 ] || \
             [ "${#VERSION_PATCH}" -gt 3 ]; then
            echo "version components are too large for an Android version code: $VERSION"
            exit 1
          fi
          ANDROID_VERSION_CODE=$((
            10#$VERSION_MAJOR * 1000000 +
            10#$VERSION_MINOR * 1000 +
            10#$VERSION_PATCH
          ))
          if [ "$ANDROID_VERSION_CODE" -lt 1 ] || [ "$ANDROID_VERSION_CODE" -gt 2100000000 ]; then
            echo "Android version code must be between 1 and 2100000000: $ANDROID_VERSION_CODE"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "android_version_code=$ANDROID_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "released_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

  # Desktop releases are the Electron client (apps/desktop). Android and the
  # web build below stay on Flutter.
  build-macos:
    runs-on: macos-latest
    needs: [prepare]
    outputs:
      signing_enabled: ${{ steps.macos_signing.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set the release version
        # electron-builder, the About page and CFBundleVersion all read it from
        # apps/desktop/package.json.
        run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version -w @gang-chat/desktop

      - name: Resolve macOS Developer ID signing
        id: macos_signing
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          configured=0
          missing=()
          for name in \
            MACOS_CERTIFICATE_BASE64 \
            MACOS_CERTIFICATE_PASSWORD \
            MACOS_SIGNING_IDENTITY \
            APPLE_NOTARY_KEY_BASE64 \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_ISSUER_ID; do
            if [ -n "${!name:-}" ]; then
              configured=$((configured + 1))
            else
              missing+=("$name")
            fi
          done

          if [ "$configured" -eq 0 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "::warning title=Unsigned macOS release::Developer ID signing secrets are not configured; the app is ad-hoc signed and not notarized. Sparkle still verifies updates with its EdDSA key."
            {
              echo "### ⚠️ Ad-hoc signed macOS artifact"
              echo
              echo "Developer ID signing secrets are not configured, so the DMG is not notarized."
              echo "Installed apps still update through Sparkle, which checks the EdDSA signature."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::macOS signing is only partially configured; missing secret: ${missing[*]}"
            exit 1
          fi

          # electron-builder imports the certificate into a temporary keychain,
          # signs with the hardened runtime and notarizes with the API key.
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          {
            echo "CSC_LINK=$RUNNER_TEMP/developer-id.p12"
            echo "CSC_KEY_PASSWORD=$MACOS_CERTIFICATE_PASSWORD"
            echo "CSC_NAME=${MACOS_SIGNING_IDENTITY#Developer ID Application: }"
            echo "APPLE_API_KEY=$RUNNER_TEMP/notary-key.p8"
            echo "APPLE_API_KEY_ID=$APPLE_NOTARY_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Package macOS
        env:
          GANG_CHAT_RELEASED_AT: ${{ needs.prepare.outputs.released_at }}
        run: npm run dist:mac -w @gang-chat/desktop

      - name: Check the packaged app
        id: dmg
        shell: bash
        run: |
          set -euo pipefail
          APP="apps/desktop/dist/mac-universal/GangChat.app"
          DMG="apps/desktop/dist/GangChat_v${{ needs.prepare.outputs.version }}.dmg"
          if [ ! -d "$APP" ] || [ ! -f "$DMG" ]; then
            echo "::error::expected $APP and $DMG"
            ls -la apps/desktop/dist
            exit 1
          fi
          # Sparkle compares CFBundleVersion: it must be the same growing
          # version code the Flutter macOS app and Android use.
          BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")"
          if [ "$BUILD_NUMBER" != "${{ needs.prepare.outputs.android_version_code }}" ]; then
            echo "::error::CFBundleVersion is $BUILD_NUMBER, expected ${{ needs.prepare.outputs.android_version_code }}"
            exit 1
          fi
          # Sparkle refuses updates whose code signature is invalid.
          codesign --verify --deep --strict "$APP"
          test -d "$APP/Contents/Frameworks/Sparkle.framework"
          test -f "$APP/Contents/Resources/sparkle/sparkle.node"
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "path=$DMG" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$DMG")" >> "$GITHUB_OUTPUT"
          ls -lh "$DMG"

      - name: Sign the update and write the Sparkle appcast
        shell: bash
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          APP="${{ steps.dmg.outputs.app }}"
          DMG_PATH="${{ steps.dmg.outputs.path }}"
          DMG="${{ steps.dmg.outputs.name }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          BUILD_NUMBER="${{ needs.prepare.outputs.android_version_code }}"
          PUBLIC_KEY="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$APP/Contents/Info.plist" 2>/dev/null || true)"

          # Every macOS install, Flutter or Electron, updates from this feed,
          # so a release without it would strand them.
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ] || [ -z "$PUBLIC_KEY" ]; then
            echo "::error::Sparkle needs both the SPARKLE_ED_PRIVATE_KEY secret and SUPublicEDKey (apps/desktop/electron-builder.yml). See docs/release-workflow.md."
            exit 1
          fi

          SIGN_UPDATE=apps/desktop/build/sparkle/bin/sign_update
          ATTRIBUTES="$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$SIGN_UPDATE" --ed-key-file - "$DMG_PATH")"
          SIGNATURE="$(printf '%s' "$ATTRIBUTES" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')"
          LENGTH="$(printf '%s' "$ATTRIBUTES" | sed -n 's/.*length="\([0-9]*\)".*/\1/p')"
          [ -n "$SIGNATURE" ] && [ -n "$LENGTH" ] || { echo "unexpected sign_update output: $ATTRIBUTES"; exit 1; }
          # Installed apps verify with SUPublicEDKey; refuse to publish an
          # update they would reject.
          swift tool/verify_sparkle_signature.swift "$PUBLIC_KEY" "$SIGNATURE" "$DMG_PATH"

          BUCKET_URL="$(python3 -c 'import json; print(json.load(open("assets/config/app_config.json"))["release_bucket_url"].rstrip("/"))')"
          PUB_DATE="$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')"
          mkdir -p release-staging
          cat > release-staging/appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>GangChat</title>
              <item>
                <title>GangChat ${VERSION}</title>
                <pubDate>${PUB_DATE}</pubDate>
                <sparkle:version>${BUILD_NUMBER}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>12.0</sparkle:minimumSystemVersion>
                <enclosure url="${BUCKET_URL}/releases/${DMG}" type="application/octet-stream" sparkle:edSignature="${SIGNATURE}" length="${LENGTH}"/>
              </item>
            </channel>
          </rss>
          EOF
          # Sign the feed too, so Sparkle can detect a tampered appcast.
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$SIGN_UPDATE" --ed-key-file - release-staging/appcast.xml
          xmllint --noout release-staging/appcast.xml
          cat release-staging/appcast.xml
          cp "$DMG_PATH" release-staging/
          echo "- ✅ macOS: Sparkle update signed; upload appcast.xml next to $DMG in releases/." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: release-staging/
          if-no-files-found: error

      - name: Clean up macOS signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-key.p8"

  build-windows:
    runs-on: windows-latest
    needs: [prepare]
    outputs:
      signing_enabled: ${{ steps.windows_signing.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set the release version
        run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version -w @gang-chat/desktop

      - name: Resolve Windows Authenticode signing
        id: windows_signing
        shell: bash
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${WINDOWS_CERTIFICATE_BASE64:-}" ] && [ -z "${WINDOWS_CERTIFICATE_PASSWORD:-}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "::warning::Authenticode signing secrets are not configured; Windows artifacts will be published unsigned."
            {
              echo "### WARNING: Unsigned Windows artifacts"
              echo
              echo "Authenticode signing secrets are not configured."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "${WINDOWS_CERTIFICATE_BASE64:-}" ] || [ -z "${WINDOWS_CERTIFICATE_PASSWORD:-}" ]; then
            echo "::error::Windows signing is only partially configured; set both WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD."
            exit 1
          fi
          # electron-builder signs GangChat.exe, the installer and the
          # uninstaller with this PFX (electron-updater then checks that every
          # update comes from the same publisher).
          printf '%s' "$WINDOWS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/authenticode.pfx"
          {
            echo "CSC_LINK=$RUNNER_TEMP/authenticode.pfx"
            echo "CSC_KEY_PASSWORD=$WINDOWS_CERTIFICATE_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Package Windows
        env:
          GANG_CHAT_RELEASED_AT: ${{ needs.prepare.outputs.released_at }}
        run: npm run dist:win -w @gang-chat/desktop

      - name: Stage Windows artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          DIST=apps/desktop/dist
          mkdir -p release-staging
          # The installer and the portable zip, plus electron-updater's feed:
          # latest.yml and the installer's blockmap (differential downloads).
          for file in \
            "GangChat_v$VERSION.exe" \
            "GangChat_v$VERSION.exe.blockmap" \
            "GangChat-$VERSION-windows.zip" \
            latest.yml; do
            test -f "$DIST/$file" || { echo "::error::missing $DIST/$file"; ls -la "$DIST"; exit 1; }
            cp "$DIST/$file" release-staging/
          done
          grep -q "path: GangChat_v$VERSION.exe" release-staging/latest.yml
          ls -l release-staging

      - name: Verify Windows signatures
        if: steps.windows_signing.outputs.enabled == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($file in @(
            "apps/desktop/dist/win-unpacked/GangChat.exe",
            "release-staging/GangChat_v${{ needs.prepare.outputs.version }}.exe"
          )) {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "$file signature status is $($signature.Status)"
            }
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: release-staging/
          if-no-files-found: error

      - name: Clean up Windows signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/authenticode.pfx"

  build-android:
    runs-on: ubuntu-latest
    needs: [prepare]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true

      - name: Flutter sanity check
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: UTF-8 encoding check
        run: dart tool/check_utf8.dart

      - name: Update release metadata
        run: |
          dart tool/update_release_metadata.dart \
            --version "${{ needs.prepare.outputs.version }}" \
            --released-at "${{ needs.prepare.outputs.released_at }}"

      - name: Prepare Android Firebase configuration
        shell: bash
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          FIREBASE_CONFIG="android/app/google-services.json"
          if [ -z "${FIREBASE_GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "::warning title=Android offline push disabled::FIREBASE_GOOGLE_SERVICES_JSON_BASE64 is not configured; this APK will not register with FCM."
            {
              echo "### WARNING: Android offline push disabled"
              echo
              echo "FIREBASE_GOOGLE_SERVICES_JSON_BASE64 is not configured."
              echo "The APK remains usable, but cannot receive FCM messages after its process exits."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" \
            | base64 --decode > "$FIREBASE_CONFIG"
          if [ ! -s "$FIREBASE_CONFIG" ]; then
            echo "decoded Firebase Android configuration is empty" >&2
            exit 1
          fi
          if ! jq -e \
            '.client[] |
             select(.client_info.android_client_info.package_name == "com.gangchat.client")' \
            "$FIREBASE_CONFIG" >/dev/null; then
            echo "Firebase configuration does not contain package com.gangchat.client" >&2
            exit 1
          fi
          chmod 600 "$FIREBASE_CONFIG"

      - name: Prepare Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "required GitHub Actions secret is missing: $name" >&2
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/gang-chat-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "decoded Android keystore is empty" >&2
            exit 1
          fi
          chmod 600 "$KEYSTORE_PATH"
          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build Android APK (release)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name="${{ needs.prepare.outputs.version }}" \
            --build-number="${{ needs.prepare.outputs.android_version_code }}"

      - name: Prepare and verify Android APK
        id: android_apk
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="build/app/outputs/flutter-apk/app-release.apk"
          APK="GangChat_v${{ needs.prepare.outputs.version }}.apk"
          if [ ! -f "$SOURCE" ]; then
            echo "release APK not found at $SOURCE" >&2
            exit 1
          fi
          cp "$SOURCE" "$APK"

          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" \
            -mindepth 2 -maxdepth 2 -type f -name apksigner \
            | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found under $ANDROID_SDK_ROOT/build-tools" >&2
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "name=$APK" >> "$GITHUB_OUTPUT"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.android_apk.outputs.name }}
          if-no-files-found: error

      - name: Clean up Android signing material
        if: always()
        shell: bash
        run: |
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            rm -f "$ANDROID_KEYSTORE_PATH"
          fi
          rm -f android/app/google-services.json

  release:
    runs-on: ubuntu-latest
    needs: [prepare, build-macos, build-windows, build-android]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release signing status
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Artifact signing status"
            echo
            if [ "${{ needs['build-windows'].outputs.signing_enabled }}" = "true" ]; then
              echo "- ✅ Windows: Authenticode signed and verified."
            else
              echo "- ⚠️ Windows: unsigned; Authenticode secrets were not configured."
            fi
            if [ "${{ needs['build-macos'].outputs.signing_enabled }}" = "true" ]; then
              echo "- ✅ macOS: Developer ID signed and notarized."
            else
              echo "- ⚠️ macOS: ad-hoc signed, not notarized (no Developer ID); Sparkle verifies updates with EdDSA."
            fi
            echo "- ✅ Android: release-key signed and verified."
          } | tee release-signing-status.md
          cat release-signing-status.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          body_path: release-signing-status.md
          files: release-assets/*

  deploy-web:
    # Runs after the GitHub Release is published, so the web client never goes
    # live for a version whose desktop/Android release failed. Setup is in
    # docs/web-spike.md under 部署.
    runs-on: ubuntu-latest
    needs: [prepare, release]
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    steps:
      - name: Check web deploy configuration
        id: web_deploy
        shell: bash
        env:
          WEB_DEPLOY_SSH: ${{ secrets.WEB_DEPLOY_SSH }}
          WEB_DEPLOY_SSH_KEY: ${{ secrets.WEB_DEPLOY_SSH_KEY }}
          WEB_DEPLOY_KNOWN_HOSTS: ${{ secrets.WEB_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          configured=()
          missing=()
          for name in WEB_DEPLOY_SSH WEB_DEPLOY_SSH_KEY WEB_DEPLOY_KNOWN_HOSTS; do
            if [ -n "${!name}" ]; then configured+=("$name"); else missing+=("$name"); fi
          done
          if [ "${#configured[@]}" -eq 0 ]; then
            echo "::warning::Web deploy skipped: WEB_DEPLOY_SSH, WEB_DEPLOY_SSH_KEY and WEB_DEPLOY_KNOWN_HOSTS are not configured."
            echo "- ⚠️ Web: not deployed; web deploy secrets were not configured." >> "$GITHUB_STEP_SUMMARY"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Web deploy is partially configured. Missing secrets: ${missing[*]}. See docs/web-spike.md (部署)."
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.web_deploy.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Setup Flutter
        if: steps.web_deploy.outputs.enabled == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true

      - name: Get dependencies
        if: steps.web_deploy.outputs.enabled == 'true'
        run: tool/pub.sh get

      - name: Update release metadata
        if: steps.web_deploy.outputs.enabled == 'true'
        run: |
          dart tool/update_release_metadata.dart \
            --version "${{ needs.prepare.outputs.version }}" \
            --released-at "${{ needs.prepare.outputs.released_at }}"

      - name: Build web
        if: steps.web_deploy.outputs.enabled == 'true'
        shell: bash
        run: tool/build_web.sh

      - name: Configure SSH
        if: steps.web_deploy.outputs.enabled == 'true'
        shell: bash
        env:
          WEB_DEPLOY_SSH_KEY: ${{ secrets.WEB_DEPLOY_SSH_KEY }}
          WEB_DEPLOY_KNOWN_HOSTS: ${{ secrets.WEB_DEPLOY_KNOWN_HOSTS }}
          WEB_DEPLOY_SSH_PORT: ${{ vars.WEB_DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$WEB_DEPLOY_SSH_KEY" > ~/.ssh/gang_chat_web_deploy
          printf '%s\n' "$WEB_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Host keys come only from the secret; an unknown or changed host
          # key fails the deploy instead of being trusted.
          {
            echo 'Host *'
            echo '  IdentityFile ~/.ssh/gang_chat_web_deploy'
            echo '  IdentitiesOnly yes'
            echo '  StrictHostKeyChecking yes'
            echo '  BatchMode yes'
            if [ -n "$WEB_DEPLOY_SSH_PORT" ]; then
              echo "  Port $WEB_DEPLOY_SSH_PORT"
            fi
          } > ~/.ssh/config

      - name: Deploy web
        if: steps.web_deploy.outputs.enabled == 'true'
        shell: bash
        env:
          GANG_WEB_DEPLOY_SSH: ${{ secrets.WEB_DEPLOY_SSH }}
          GANG_WEB_DEPLOY_DIR: ${{ vars.WEB_DEPLOY_DIR || '/var/www/gang-chat-app' }}
        run: |
          set -euo pipefail
          tool/deploy_web.sh --no-build
          echo "- ✅ Web: deployed ${{ needs.prepare.outputs.version }} to https://ky-z.com/gang-chat/app/" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove SSH key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/gang_chat_web_deploy ~/.ssh/config
