name: deploy-web

# Builds the Flutter web client and deploys it to
# https://ky-z.com/gang-chat/app/ with tool/deploy_web.sh. Setup (secrets,
# deploy key, nginx) is in docs/web-spike.md under 部署.
#
# Manual only for now: the web build still has known broken features, so it
# must not redeploy on every push or release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version shown in Settings, for example 1.2.0 (optional)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check deploy secrets
        shell: bash
        env:
          WEB_DEPLOY_SSH: ${{ secrets.WEB_DEPLOY_SSH }}
          WEB_DEPLOY_SSH_KEY: ${{ secrets.WEB_DEPLOY_SSH_KEY }}
          WEB_DEPLOY_KNOWN_HOSTS: ${{ secrets.WEB_DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=()
          [ -n "$WEB_DEPLOY_SSH" ] || missing+=(WEB_DEPLOY_SSH)
          [ -n "$WEB_DEPLOY_SSH_KEY" ] || missing+=(WEB_DEPLOY_SSH_KEY)
          [ -n "$WEB_DEPLOY_KNOWN_HOSTS" ] || missing+=(WEB_DEPLOY_KNOWN_HOSTS)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}. See docs/web-spike.md (部署)."
            exit 1
          fi

      - name: Check version input
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be major.minor.patch: $VERSION"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true

      - name: Flutter sanity check
        run: flutter --version

      - name: Build web
        shell: bash
        env:
          GANG_CHAT_VERSION: ${{ inputs.version }}
        run: tool/build_web.sh

      - name: Configure SSH
        shell: bash
        env:
          WEB_DEPLOY_SSH_KEY: ${{ secrets.WEB_DEPLOY_SSH_KEY }}
          WEB_DEPLOY_KNOWN_HOSTS: ${{ secrets.WEB_DEPLOY_KNOWN_HOSTS }}
          WEB_DEPLOY_SSH_PORT: ${{ vars.WEB_DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$WEB_DEPLOY_SSH_KEY" > ~/.ssh/gang_chat_web_deploy
          printf '%s\n' "$WEB_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Host keys come only from the secret; an unknown or changed host
          # key fails the deploy instead of being trusted.
          {
            echo 'Host *'
            echo '  IdentityFile ~/.ssh/gang_chat_web_deploy'
            echo '  IdentitiesOnly yes'
            echo '  StrictHostKeyChecking yes'
            echo '  BatchMode yes'
            if [ -n "$WEB_DEPLOY_SSH_PORT" ]; then
              echo "  Port $WEB_DEPLOY_SSH_PORT"
            fi
          } > ~/.ssh/config

      - name: Deploy
        shell: bash
        env:
          GANG_WEB_DEPLOY_SSH: ${{ secrets.WEB_DEPLOY_SSH }}
          GANG_WEB_DEPLOY_DIR: ${{ vars.WEB_DEPLOY_DIR || '/var/www/gang-chat-app' }}
        run: tool/deploy_web.sh --no-build

      - name: Remove SSH key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/gang_chat_web_deploy ~/.ssh/config
